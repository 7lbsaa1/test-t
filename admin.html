<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم — 7LBSAA-T</title>
<meta name="theme-color" content="#111111">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111111;--ivory:#F7F5F0;--char:#292929;--gold:#B79B69;--muted:#6f6a60;--line:rgba(17,17,17,.13);--ok:#3d7a3d;--bad:#b3453b;--sans:"Jost","Tajawal",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:1280px;margin-inline:auto;padding:0 18px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;background:var(--ink);color:var(--ivory);padding:20px}
.login-box{width:100%;max-width:380px;background:var(--char);border:1px solid rgba(183,155,105,.4);padding:38px 30px;text-align:center}
.logo{font-size:24px;letter-spacing:.26em;text-transform:uppercase;font-weight:300}
.logo i{color:var(--gold);font-style:normal}
.login-box input{width:100%;background:rgba(247,245,240,.06);border:1px solid rgba(247,245,240,.25);color:var(--ivory);padding:13px;margin:18px 0 4px;outline:none;text-align:center;letter-spacing:.3em}
.login-box button{width:100%;background:var(--gold);color:#141414;padding:13px;margin-top:14px;letter-spacing:.2em;text-transform:uppercase;font-size:12px}
.login-box button:hover{filter:brightness(1.08)}
.err-msg{color:#e08a84;font-size:12.5px;min-height:18px;margin-top:8px}

/* layout */
.bar{position:sticky;top:0;z-index:20;background:rgba(17,17,17,.97);color:var(--ivory);display:flex;align-items:center;gap:14px;padding:12px 18px;flex-wrap:wrap}
.bar .logo{font-size:18px}
.bar nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
.bar nav button{padding:8px 14px;font-size:12.5px;letter-spacing:.06em;border:1px solid transparent;color:rgba(247,245,240,.75)}
.bar nav button.on{color:var(--gold);border-color:rgba(183,155,105,.5)}
.bar .out{font-size:12px;color:rgba(247,245,240,.6);border:1px solid rgba(247,245,240,.25);padding:8px 12px}
.earnings{background:var(--gold);color:#141414;padding:6px 14px;font-size:13px;font-weight:500;border-radius:2px}

main{padding:26px 0 70px}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:24px}
.stat{background:#fff;border:1px solid var(--line);padding:16px}
.stat small{color:var(--muted);font-size:11.5px;letter-spacing:.08em;display:block;margin-bottom:6px}
.stat b{font-size:22px;font-weight:500}
.panel{background:#fff;border:1px solid var(--line);padding:20px;margin-bottom:22px}
.panel h3{font-size:14px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;color:var(--char);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}

/* forms */
.f-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:11.5px;letter-spacing:.08em;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--ivory);padding:10px;outline:none;min-height:42px}
.f input:focus,.f textarea:focus{border-color:var(--gold);background:#fff}
.f textarea{min-height:70px;resize:vertical}
.btn{background:var(--ink);color:var(--ivory);padding:11px 20px;letter-spacing:.12em;text-transform:uppercase;font-size:11.5px;min-height:44px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{background:var(--char)}
.btn.gold{background:var(--gold);color:#141414}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:none;border:1px solid var(--bad);color:var(--bad)}
.btn.sm{padding:7px 12px;min-height:34px;font-size:11px}

/* products table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:start;vertical-align:middle}
.tbl th{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;background:rgba(17,17,17,.03)}
.tbl img{width:52px;height:64px;object-fit:cover}
.tbl .act-row{display:flex;gap:6px;flex-wrap:wrap}
.stockchip{font-size:11px;padding:3px 8px;border:1px solid var(--line)}
.stockchip.low{color:var(--bad);border-color:var(--bad)}
.stockchip.out{background:var(--bad);color:#fff}

/* orders */
.order-card{border:1px solid var(--line);background:#fff;margin-bottom:14px}
.o-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:wrap}
.o-head b{font-size:14px}
.o-ref{color:var(--gold);font-weight:500;letter-spacing:.06em}
.o-body{display:none;padding:16px;grid-template-columns:1.4fr .8fr;gap:18px}
.order-card.open .o-body{display:grid}
@media(max-width:760px){.o-body{grid-template-columns:1fr}}
.o-items{font-size:13px}
.o-items li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.o-cust p{font-size:13px;margin-bottom:4px;word-break:break-word}
.o-cust img{max-height:130px;margin-top:8px;border:1px solid var(--line);cursor:zoom-in}
.o-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.status{font-size:11px;padding:4px 10px;letter-spacing:.06em;border:1px solid var(--line)}
.status.received{background:#efe9dc;color:#7a5c1e}
.status.prep{background:#e3ecf5;color:#2d5a86}
.status.shipped{background:#e8e6f8;color:#4a3f9e}
.status.delivered{background:#e2f0e2;color:var(--ok)}
.status.cancelled{background:#f7e4e2;color:var(--bad)}
.status.returned{background:#eee;color:#555}
.idzoom{position:fixed;inset:0;z-index:99;background:rgba(17,17,17,.85);display:none;place-items:center;padding:20px}
.idzoom.on{display:grid}
.idzoom img{max-height:90vh;max-width:92vw}

/* modal product editor */
.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:16px;background:rgba(17,17,17,.7)}
.modal.on{display:grid}
.modal-box{background:var(--ivory);width:100%;max-width:680px;max-height:92vh;overflow:auto;padding:24px;position:relative}
.modal-x{position:absolute;top:10px;left:10px;width:38px;height:38px;font-size:19px}
.up-drop{border:1px dashed var(--line);padding:14px;text-align:center;font-size:12.5px;color:var(--muted);cursor:pointer}
.up-drop img{max-height:150px;margin:8px auto 0}
.color-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.color-row input[type=color]{width:38px;height:38px;padding:2px;border:1px solid var(--line);background:none}
.size-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.size-row input[type=number]{width:70px}

/* tables small */
.mini{font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:20px;inset-inline:0;display:flex;justify-content:center;z-index:120;pointer-events:none}
.toast b{background:var(--ink);color:var(--ivory);padding:12px 20px;font-weight:400;font-size:13px;opacity:0;transform:translateY(12px);transition:.35s}
.toast.on b{opacity:1;transform:none}
.bar-anim{height:10px;background:var(--ivory);border:1px solid var(--line)}
.bar-anim i{display:block;height:100%;background:var(--gold)}
@media(max-width:640px){.tbl .hide-sm{display:none}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login-view">
  <div class="login-box">
    <div class="logo">7LBSAA<i>-</i>T</div>
    <p style="color:rgba(247,245,240,.55);font-size:12px;letter-spacing:.18em;margin-top:6px">ADMIN DASHBOARD</p>
    <input type="password" id="adm-pass" placeholder="••••••••" autocomplete="current-password">
    <button id="login-btn">دخول</button>
    <div class="err-msg" id="login-err"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dash-view" hidden>
  <div class="bar">
    <span class="logo">7LBSAA<i>-</i>T</span>
    <span class="earnings">💰 <span id="earn-val">0</span> ج.م</span>
    <nav id="tabs">
      <button data-tab="orders" class="on">الطلبات</button>
      <button data-tab="products">المنتجات</button>
      <button data-tab="coupons">الكوبونات</button>
      <button data-tab="reports">التقارير</button>
      <button data-tab="settings">الإعدادات</button>
    </nav>
    <a class="out" href="index.html" target="_blank">الموقع ↗</a>
    <button class="out" id="logout-btn">خروج</button>
  </div>

  <main class="wrap">
    <div class="stats" id="stats"></div>
    <div id="panel"></div>
  </main>
</div>

<div class="idzoom" id="idzoom"><img id="idzoom-img" alt=""></div>
<div class="toast" id="toast"><b></b></div>
<div class="modal" id="modal"><div class="modal-box" id="modal-box"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
/* ============ FIREBASE ============ */
const firebaseConfig={
  apiKey:"AIzaSyAxdGkvwTeZSxkrgVSACgaoYrzaGLlcI0k",
  authDomain:"test-t-bdfbe.firebaseapp.com",
  databaseURL:"https://test-t-bdfbe-default-rtdb.firebaseio.com",
  projectId:"test-t-bdfbe",
  storageBucket:"test-t-bdfbe.firebasestorage.app",
  messagingSenderId:"211509136380",
  appId:"1:211509136380:web:139a6409a17bfb124bc079"
};
let rtdb=null;
try{firebase.initializeApp(firebaseConfig);rtdb=firebase.database();}catch(e){console.warn(e)}

/* ============ HELPERS ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('en-US')+' ج.م';
const LS={auth:'7l_admin'};
const SIZES=['S','M','L','XL','XXL'];
const S={tab:'orders',products:[],orders:{},coupons:{},messages:{},settings:{},admPass:null};

function defSettings(){
  return {phone:'201000000000',whatsapp:'201000000000',email:'care@7lbsaa-t.com',
    freeOver:2000,shipDefault:60,shipping:{},online:false,instapay:'',vodafone:'',adminPass:'7lbsaa-admin'};
}

/* ============ LOGIN ============ */
async function loadAdminPass(){
  if(!rtdb) return defSettings().adminPass;
  const snap=await rtdb.ref('settings/adminPass').once('value').catch(()=>null);
  return snap&&snap.val()||defSettings().adminPass;
}
async function tryLogin(){
  const pass=$('#adm-pass').value;
  if(!S.admPass) S.admPass=await loadAdminPass();
  if(pass===S.admPass){
    sessionStorage.setItem(LS.auth,'1');
    openDash();
  }else{
    $('#login-err').textContent='كلمة مرور خاطئة. حاول مجددًا.';
    $('#adm-pass').value='';
  }
}
$('#login-btn').addEventListener('click',tryLogin);
$('#adm-pass').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin()});
$('#logout-btn').addEventListener('click',()=>{sessionStorage.removeItem(LS.auth);location.reload()});

if(sessionStorage.getItem(LS.auth)===openDashTag()){openDash()}
function openDashTag(){return '1'}
function openDash(){
  $('#login-view').hidden=true;$('#dash-view').hidden=false;
  bindData();renderStats();renderTab();
}

/* ============ DATA BINDING ============ */
function bindData(){
  if(!rtdb)return;
  rtdb.ref('products').on('value',s=>{S.products=s.val()?Object.values(s.val()):[];renderTab();renderStats()});
  rtdb.ref('orders').on('value',s=>{S.orders=s.val()||{};renderTab();renderStats()});
  rtdb.ref('coupons').on('value',s=>{S.coupons=s.val()||{};renderTab()});
  rtdb.ref('settings').on('value',s=>{S.settings=Object.assign(defSettings(),s.val()||{});S.admPass=S.settings.adminPass});
  rtdb.ref('messages').on('value',s=>{S.messages=s.val()||{};renderTab()});
}

/* ============ STATS ============ */
function ordersArr(){return Object.values(S.orders).sort((a,b)=>(b.at||0)-(a.at||0))}
function renderStats(){
  const os=ordersArr();
  const confirmed=os.filter(o=>o.status==='delivered');
  const earn=confirmed.reduce((a,o)=>a+Number(o.total||0),0);
  const pending=os.filter(o=>['received','prep','shipped'].includes(o.status||'received')).length;
  const low=S.products.filter(p=>Object.values(p.stock||{}).some(v=>Number(v)<=2)).length;
  $('#earn-val').textContent=earn.toLocaleString('en-US');
  $('#stats').innerHTML=[
    ['رصيد المبيعات المؤكد',money(earn)],
    ['إجمالي الطلبات',os.length],
    ['طلبات قيد التنفيذ',pending],
    ['المنتجات',S.products.length],
    ['منتجات كميتها منخفضة',low]
  ].map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');
}

/* ============ TABS ============ */
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  S.tab=b.dataset.tab;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  renderTab();
});
function renderTab(){
  if($('#dash-view').hidden)return;
  const p=$('#panel');
  if(S.tab==='orders')p.innerHTML=tabOrders();
  else if(S.tab==='products')p.innerHTML=tabProducts();
  else if(S.tab==='coupons')p.innerHTML=tabCoupons();
  else if(S.tab==='reports')p.innerHTML=tabReports();
  else if(S.tab==='settings')p.innerHTML=tabSettings();
}

/* ---------- ORDERS ---------- */
const ST_LABEL={received:'تم استلام الطلب',prep:'قيد التجهيز',shipped:'تم الشحن',delivered:'تم التسليم',cancelled:'ملغي',returned:'مرتجع'};
const ST_CLS={received:'received',prep:'prep',shipped:'shipped',delivered:'delivered',cancelled:'cancelled',returned:'returned'};

function tabOrders(){
  const os=ordersArr();
  if(!os.length)return `<div class="panel"><p class="mini">لا توجد طلبات بعد.</p></div>`;
  return os.map(o=>{
    const st=o.status||'received';
    const items=(o.items||[]).map(i=>`<li><span>${esc(i.name_ar)} (${esc(i.size)}) ×${i.qty}</span><span>${money(i.price*i.qty)}</span></li>`).join('');
    const wa='https://wa.me/'+String(o.customer?.phone||'').replace(/\D/g,'').replace(/^0/,'20')+'?text='+encodeURIComponent('تحية طيبة من 7LBSAA-T بخصوص طلبك رقم '+o.ref);
    return `<div class="order-card" data-ref="${esc(o.ref)}">
      <div class="o-head" data-act="toggle-order">
        <b><span class="o-ref">${esc(o.ref)}</span> — ${esc(o.customer?.name||'')}</b>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span>${money(o.total)}</span>
          <span class="status ${ST_CLS[st]}">${ST_LABEL[st]}</span>
        </div>
      </div>
      <div class="o-body">
        <div class="o-items"><ul>${items}</ul>
          <p class="mini" style="margin-top:8px">المجموع: ${money(o.subtotal)} · الخصم: ${money(o.discount||0)} · الشحن: ${money(o.ship||0)} · <b>الإجمالي: ${money(o.total)}</b></p>
          <p class="mini">${o.payment==='cod'?'الدفع عند الاستلام':'دفع إلكتروني ('+esc(o.payment)+')'} · ${new Date(o.at).toLocaleString('ar-EG')}</p>
        </div>
        <div class="o-cust">
          <p><b>${esc(o.customer?.name||'')}</b></p>
          <p>📞 ${esc(o.customer?.phone||'')}</p>
          <p>📍 ${esc(o.customer?.gov||'')} — ${esc(o.customer?.city||'')}</p>
          <p>${esc(o.customer?.address||'')}</p>
          ${o.customer?.notes?`<p class="mini">📝 ${esc(o.customer.notes)}</p>`:''}
          ${o.idCard?`<img src="${o.idCard}" alt="بطاقة" data-act="zoom-id">`:'<p class="mini">لا توجد صورة بطاقة</p>'}
          <div class="o-actions">
            <a class="btn sm gold" href="${wa}" target="_blank" rel="noopener">واتساب العميل</a>
            <button class="btn sm ghost" data-act="st" data-ref="${esc(o.ref)}" data-st="prep">تجهيز</button>
            <button class="btn sm ghost" data-act="st" data-ref="${esc(o.ref)}" data-st="shipped">شحن</button>
            <button class="btn sm" data-act="st" data-ref="${esc(o.ref)}" data-st="delivered">✔ تم التسليم</button>
            <button class="btn sm danger" data-act="st" data-ref="${esc(o.ref)}" data-st="cancelled">إلغاء</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ---------- PRODUCTS ---------- */
function totalStock(p){return Object.values(p.stock||{}).reduce((a,b)=>a+Number(b||0),0)}
function stockChip(p){
  const t=totalStock(p);
  const cls=t<=0?'out':t<=5?'low':'';
  return `<span class="stockchip ${cls}">${t<=0?'نفد':t} قطعة</span>`;
}
function tabProducts(){
  return `<div class="panel">
    <h3>المنتجات <button class="btn sm gold" data-act="new-product">+ منتج جديد</button></h3>
    <div style="overflow-x:auto"><table class="tbl">
      <tr><th>الصورة</th><th>الاسم</th><th class="hide-sm">التصنيف</th><th>السعر</th><th class="hide-sm">المخزون</th><th>إجراءات</th></tr>
      ${S.products.map(p=>`<tr>
        <td><img src="${esc((p.images||[])[0]||'')}" alt=""></td>
        <td><b>${esc(p.name_ar)}</b><br><span class="mini">${esc(p.name_en||'')}</span></td>
        <td class="hide-sm">${esc(p.category||'')}</td>
        <td><b>${money(p.price)}</b>${p.oldPrice?`<br><del class="mini">${money(p.oldPrice)}</del>`:''}</td>
        <td class="hide-sm">${stockChip(p)}</td>
        <td><div class="act-row">
          <button class="btn sm ghost" data-act="edit-product" data-id="${esc(p.id)}">تعديل</button>
          <button class="btn sm danger" data-act="del-product" data-id="${esc(p.id)}">حذف</button>
        </div></td>
      </tr>`).join('')||'<tr><td colspan="6" class="mini">لا منتجات. أضف أول منتج.</td></tr>'}
    </table></div>
  </div>`;
}

function productModal(p){
  const isNew=!p;
  p=p||{id:'p'+Date.now().toString(36),name_ar:'',name_en:'',price:250,oldPrice:'',category:'tshirts',fabric_ar:'',fabric_en:'',desc_ar:'',desc_en:'',images:[],sizes:SIZES.slice(),stock:{S:5,M:5,L:5,XL:3,XXL:2},colors:[{ar:'أسود',en:'Black',hex:'#111111'}],best:false,createdAt:Date.now()};
  const colorsHtml=(p.colors||[]).map((c,i)=>`<div class="color-row"><input type="color" value="${esc(c.hex)}" data-cr-hex="${i}"><input value="${esc(c.ar)}" data-cr-ar="${i}" placeholder="اسم بالعربي"><input value="${esc(c.en||'')}" data-cr-en="${i}" placeholder="English"><button class="btn sm danger" data-act="rm-color" data-i="${i}">✕</button></div>`).join('');
  const sizesHtml=SIZES.map(s=>{
    const on=(p.sizes||[]).includes(s);
    return `<div class="size-row"><label style="min-width:44px"><input type="checkbox" data-sz="${s}" ${on?'checked':''}> ${s}</label><input type="number" min="0" data-stk="${s}" value="${Number((p.stock||{})[s]||0)}" placeholder="كمية"></div>`;
  }).join('');
  $('#modal-box').innerHTML=`
    <button class="modal-x" data-act="close-modal">✕</button>
    <h3 style="margin-bottom:16px">${isNew?'إضافة منتج جديد':'تعديل: '+esc(p.name_ar)}</h3>
    <div class="f-grid">
      <label class="f"><label>الاسم (عربي)</label><input id="m-name-ar" value="${esc(p.name_ar)}"></label>
      <label class="f"><label>الاسم (إنجليزي)</label><input id="m-name-en" value="${esc(p.name_en||'')}"></label>
      <label class="f"><label>السعر (ج.م)</label><input id="m-price" type="number" min="0" value="${Number(p.price)||0}"></label>
      <label class="f"><label>السعر قبل الخصم (اختياري)</label><input id="m-old" type="number" min="0" value="${esc(p.oldPrice||'')}"></label>
      <label class="f"><label>التصنيف</label><select id="m-cat">${['tshirts','shirts','pants','shoes','accessories'].map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select></label>
      <label class="f"><label>الأكثر مبيعًا؟</label><select id="m-best"><option value="0" ${!p.best?'selected':''}>لا</option><option value="1" ${p.best?'selected':''}>نعم</option></select></label>
    </div>

function readProductForm(id){
  const colors=[];
  document.querySelectorAll('[data-cr-hex]').forEach(el=>{
    const i=el.dataset.crHex;
    colors.push({hex:el.value,ar:document.querySelector(`[data-cr-ar="${i}"]`).value||'لون',en:document.querySelector(`[data-cr-en="${i}"]`).value||''});
  });
  const sizes=[],stock={};
  document.querySelectorAll('[data-sz]').forEach(cb=>{
    if(cb.checked){sizes.push(cb.dataset.sz);stock[cb.dataset.sz]=Number(document.querySelector(`[data-stk="${cb.dataset.sz}"]`).value)||0}
  });
  const old=$('#m-old').value;
  return {
    id, name_ar:$('#m-name-ar').value.trim(), name_en:$('#m-name-en').value.trim(),
    price:Number($('#m-price').value)||0, oldPrice:old?Number(old):null,
    category:$('#m-cat').value, best:$('#m-best').value==='1',
    desc_ar:$('#m-desc-ar').value.trim(), fabric_ar:$('#m-fab-ar').value.trim(),
    images:window.__editImages||[], sizes:sizes.length?sizes:SIZES.slice(),
    stock, colors:colors.length?colors:[{ar:'أسود',en:'Black',hex:'#111111'}],
    createdAt:Date.now()
  };
}

/* ---------- REPORTS ---------- */
function tabReports(){
  const os=ordersArr();
  const delivered=os.filter(o=>o.status==='delivered');

  const revenue=delivered.reduce((a,o)=>a+Number(o.total||0),0);
  const byProduct={};
  os.forEach(o=>(o.items||[]).forEach(i=>{

  const maxQty=top[0]?top[0][1].qty:1;
  const msgs=Object.values(S.messages).sort((a,b)=>(b.at||0)-(a.at||0)).slice(0,8);

      <div class="stat"><small>طلبات مسلّمة</small><b>${delivered.length}</b></div>

    <table class="tbl"><tr><th>المنتج</th><th>الكمية</th><th class="hide-sm">الإيراد</th><th class="hide-sm" style="width:30%"></th></tr>
    ${top.map(([n,d])=>`<tr><td>${esc(n)}</td><td>${d.qty}</td><td class="hide-sm">${money(d.revenue)}</td><td class="hide-sm"><div class="bar-anim"><i style="width:${Math.round(d.qty/maxQty*100)}%"></i></div></td></tr>`).join('')||'<tr><td colspan="4" class="mini">لا بيانات بعد.</td></tr>'}

/* ============ IMAGE COMPRESS → BASE64 ============ */
function compressToBase64(file,max=800,cb){
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
    const sc=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');
    cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    URL.revokeObjectURL(url);
    cb(cv.toDataURL('image/jpeg',.72));
  };
  img.src=url;
}

/* ============ EVENTS ============ */
document.body.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;

  if(a==='toggle-order'){t.closest('.order-card').classList.toggle('open');return}
  if(a==='zoom-id'){$('#idzoom-img').src=t.src;$('#idzoom').classList.add('on');return}
  if(a==='st'){
    const ref=t.dataset.ref,st=t.dataset.st;
    if(st==='cancelled'&&!confirm('هل تريد إلغاء هذا الطلب؟'))return;
    const o=S.orders[ref];
    /* عند الإلغاء: إرجاع الكمية للمخزون مرة واحدة */
    if(st==='cancelled'&&o&&!o._restocked){
      (o.items||[]).forEach(i=>{
        const p=S.products.find(x=>x.id===i.pid);
        if(p&&p.stock&&p.stock[i.size]!=null) p.stock[i.size]=Number(p.stock[i.size]||0)+Number(i.qty||0);
      });
      if(rtdb)(o.items||[]).forEach(i=>{
        const p=S.products.find(x=>x.id===i.pid);
        if(p)rtdb.ref('products/'+p.id+'/stock/'+i.size).set(Number(p.stock[i.size]||0));
      });
      o._restocked=true;
      if(rtdb)rtdb.ref('orders/'+ref+'/_restocked').set(true);
    }
    if(rtdb)rtdb.ref('orders/'+ref+'/status').set(st).then(()=>{rtdb.ref('orders/'+ref+'/updatedAt').set(Date.now());toast('تم تحديث الحالة: '+(ST_LABEL[st]||st))});
    else{o.status=st;o.updatedAt=Date.now();renderTab();renderStats();toast('تم تحديث الحالة (وضع محلي)')}
    return;
  }
  if(a==='new-product'){productModal(null);return}
  if(a==='edit-product'){productModal(S.products.find(p=>p.id===t.dataset.id));return}
  if(a==='del-product'){
    const p=S.products.find(x=>x.id===t.dataset.id);
    if(!p||!confirm('حذف "'+(p.name_ar)+'" نهائيًا؟'))return;
    if(rtdb)rtdb.ref('products/'+p.id).remove().then(()=>toast('تم حذف المنتج'));
    else{S.products=S.products.filter(x=>x.id!==p.id);renderTab();toast('تم الحذف (محلي)')}
    return;
  }
  if(a==='save-product'){
    const p=readProductForm(t.dataset.id);
    if(!p.name_ar||!p.price){toast('الاسم والسعر مطلوبان');return}
    if(rtdb)rtdb.ref('products/'+p.id).set(p).then(()=>{closeModal();toast('تم حفظ المنتج ✓')});
    else{const i=S.products.findIndex(x=>x.id===p.id);if(i>=0)S.products[i]=p;else S.products.push(p);closeModal();renderTab();toast('تم الحفظ (محلي)')}
    return;
  }
  if(a==='add-color'){
    const box=t.previousElementSibling;
    const i=box.querySelectorAll('.color-row').length;
    const div=document.createElement('div');div.className='color-row';div.innerHTML=`<input type="color" value="#111111" data-cr-hex="${i}"><input data-cr-ar="${i}" placeholder="اسم بالعربي"><input data-cr-en="${i}" placeholder="English"><button class="btn sm danger" data-act="rm-color" data-i="${i}">✕</button>`;
    box.appendChild(div);return;
  }
  if(a==='rm-color'){t.closest('.color-row').remove();return}
  if(a==='up-img'){$('#img-file').click();return}
  if(a==='rm-img'){const i=Number(t.dataset.i);window.__editImages.splice(i,1);t.closest('div').remove();return}
  if(a==='add-coupon'){
    const code=($('#cp-code').value||'').trim().toUpperCase();
    const val=Number($('#cp-val').value)||0;
    if(!code||!val){toast('أدخل الكود والقيمة');return}
    const c={type:$('#cp-type').value,value:val};
    if(rtdb)rtdb.ref('coupons/'+code).set(c).then(()=>{$('#cp-code').value='';$('#cp-val').value='';toast('تم إضافة الكوبون ✓')});
    else{S.coupons[code]=c;renderTab();toast('تم (محلي)')}
    return;
  }
  if(a==='del-coupon'){
    const k=t.dataset.k;
    if(rtdb)rtdb.ref('coupons/'+k).remove().then(()=>toast('تم حذف الكوبون'));
    else{delete S.coupons[k];renderTab()}
    return;
  }
  if(a==='save-settings'){
    const shipping={};
    document.querySelectorAll('[data-ship]').forEach(inp=>{if(inp.value!=='')shipping[inp.dataset.ship]=Number(inp.value)});
    const s={whatsapp:$('#s-wa').value.trim(),phone:$('#s-phone').value.trim(),email:$('#s-email').value.trim(),
      freeOver:Number($('#s-free').value)||0,shipDefault:Number($('#s-ship').value)||60,
      online:$('#s-online').value==='1',instapay:$('#s-ipay').value.trim(),vodafone:$('#s-voda').value.trim(),
      adminPass:$('#s-pass').value.trim(),shipping};
    if(rtdb)rtdb.ref('settings').update(s).then(()=>toast('تم حفظ الإعدادات ✓ وستظهر على الموقع فورًا'));
    else{S.settings=Object.assign(S.settings,s);toast('تم (محلي)')}
    return;
  }
  if(a==='close-modal')closeModal();
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function closeModal(){$('#modal').classList.remove('on')}
$('#idzoom').addEventListener('click',()=>$('#idzoom').classList.remove('on'));

/* file inputs */
document.body.addEventListener('change',e=>{
  if(e.target.id==='img-file'){
    const f=e.target.files[0];if(!f)return;
    compressToBase64(f,800,b64=>{
      window.__editImages.push(b64);
      const div=document.createElement('div');div.style.cssText='position:relative';
      div.innerHTML=`<img src="${b64}" style="width:64px;height:80px;object-fit:cover"><button class="btn sm danger" style="position:absolute;top:-6px;left:-6px;padding:2px 7px" data-act="rm-img" data-i="${window.__editImages.length-1}">✕</button>`;
      $('#img-list').appendChild(div);
      toast('تمت إضافة الصورة');
    });
  }
});

/* toast */
let toastT;
function toast(msg){const el=$('#toast');el.querySelector('b').textContent=msg;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2600)}
</script>
