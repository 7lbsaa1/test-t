<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | 7LBSAA-T Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: { DEFAULT: '#B79B69', dark: '#9A7D4A', light: '#D4BC8E' },
                        obsidian: '#0d0d0d',
                        charcoal: '#1a1a1a',
                        surface: '#222222'
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-obsidian text-[#F7F5F0] antialiased min-h-screen">

    <!-- Login Screen -->
    <div id="login-overlay" class="fixed inset-0 z-50 bg-obsidian flex items-center justify-center p-4">
        <div class="bg-surface border border-white/10 max-w-md w-full p-8 rounded-2xl shadow-2xl">
            <h2 class="font-serif text-3xl font-bold text-gold mb-2 text-center">7LBSAA-T Admin</h2>
            <p class="text-gray-400 text-xs text-center mb-6 uppercase tracking-wider">تسجيل دخول لوحة الإدارة الآمنة</p>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">البريد الإلكتروني</label>
                    <input type="email" id="admin-email" required value="admin@7lbsaa.com" class="w-full bg-obsidian border border-white/10 rounded px-4 py-2.5 text-sm text-white focus:outline-none focus:border-gold">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">كلمة المرور</label>
                    <input type="password" id="admin-password" required value="7lbsaa2026" class="w-full bg-obsidian border border-white/10 rounded px-4 py-2.5 text-sm text-white focus:outline-none focus:border-gold">
                </div>
                <button type="submit" class="w-full bg-gold hover:bg-gold-dark text-black font-bold py-3.5 rounded transition uppercase tracking-wider text-sm mt-4">
                    دخول اللوحة
                </button>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div id="admin-dashboard" class="hidden min-h-screen flex flex-col md:flex-row">
        <aside class="w-full md:w-64 bg-charcoal border-b md:border-b-0 md:border-l border-white/10 p-6 flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between mb-8">
                    <h1 class="font-serif text-2xl font-bold text-gold">7LBSAA-T</h1>
                    <a href="/" class="text-xs text-gray-400 hover:text-gold"><i class="fa-solid fa-store"></i> المتجر</a>
                </div>
                <nav class="space-y-2">
                    <button onclick="switchTab('overview')" id="tab-overview" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-gold text-black font-semibold text-sm transition"><i class="fa-solid fa-chart-pie"></i> الرئيسية</button>
                    <button onclick="switchTab('products')" id="tab-products" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-white/5 font-semibold text-sm transition"><i class="fa-solid fa-shirt"></i> المنتجات</button>
                    <button onclick="switchTab('orders')" id="tab-orders" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-white/5 font-semibold text-sm transition"><i class="fa-solid fa-box"></i> الطلبات</button>
                </nav>
            </div>
            <div class="pt-6 border-t border-white/10 text-xs text-gray-500">
                <p id="admin-user-email" class="mb-2 text-white truncate"></p>
                <button onclick="handleLogout()" class="text-red-400 hover:text-red-300 flex items-center gap-2"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button>
            </div>
        </aside>

        <main class="flex-1 p-6 md:p-10 overflow-y-auto">
            <!-- Overview -->
            <div id="section-overview" class="space-y-8">
                <h2 class="font-serif text-3xl font-bold mb-2">لوحة الإحصائيات</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                    <div class="bg-surface border border-white/10 p-6 rounded-2xl">
                        <span class="text-gray-400 text-xs uppercase block mb-2">إجمالي المبيعات المحققة</span>
                        <h3 id="stat-revenue" class="text-3xl font-bold text-gold">0 EGP</h3>
                    </div>
                    <div class="bg-surface border border-white/10 p-6 rounded-2xl">
                        <span class="text-gray-400 text-xs uppercase block mb-2">إجمالي المنتجات</span>
                        <h3 id="stat-products" class="text-3xl font-bold text-white">0</h3>
                    </div>
                    <div class="bg-surface border border-white/10 p-6 rounded-2xl">
                        <span class="text-gray-400 text-xs uppercase block mb-2">إجمالي الطلبات</span>
                        <h3 id="stat-orders" class="text-3xl font-bold text-white">0</h3>
                    </div>
                </div>
            </div>

            <!-- Products -->
            <div id="section-products" class="hidden space-y-8">
                <div class="flex justify-between items-center">
                    <h2 class="font-serif text-3xl font-bold">إدارة المنتجات</h2>
                    <button onclick="openProductModal()" class="bg-gold text-black font-semibold px-6 py-3 rounded text-xs uppercase"><i class="fa-solid fa-plus"></i> إضافة منتج</button>
                </div>
                <div class="bg-surface border border-white/10 rounded-2xl overflow-x-auto">
                    <table class="w-full text-right text-sm">
                        <thead class="bg-obsidian/50 border-b border-white/10 text-gray-400 text-xs uppercase">
                            <tr><th class="p-4">المنتج</th><th class="p-4">السعر</th><th class="p-4 text-center">الإجراءات</th></tr>
                        </thead>
                        <tbody id="products-table-body" class="divide-y divide-white/5"></tbody>
                    </table>
                </div>
            </div>

            <!-- Orders -->
            <div id="section-orders" class="hidden space-y-8">
                <h2 class="font-serif text-3xl font-bold">إدارة الطلبات</h2>
                <div class="bg-surface border border-white/10 rounded-2xl overflow-x-auto">
                    <table class="w-full text-right text-sm">
                        <thead class="bg-obsidian/50 border-b border-white/10 text-gray-400 text-xs uppercase">
                            <tr><th class="p-4">العميل</th><th class="p-4">الهاتف / العنوان</th><th class="p-4">الإجمالي</th><th class="p-4">الحالة</th><th class="p-4">البطاقة</th><th class="p-4 text-center">واتساب</th></tr>
                        </thead>
                        <tbody id="orders-table-body" class="divide-y divide-white/5"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Product Modal -->
    <div id="product-modal" class="fixed inset-0 z-50 bg-black/80 hidden items-center justify-center p-4">
        <div class="bg-surface border border-white/10 max-w-lg w-full rounded-2xl p-6 relative">
            <button onclick="closeProductModal()" class="absolute top-4 left-4 text-gray-400"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="font-serif text-2xl font-bold text-white mb-6">إضافة / تعديل منتج</h3>
            <form onsubmit="saveProduct(event)" class="space-y-4">
                <input type="hidden" id="prod-id">
                <input type="text" id="prod-name" placeholder="اسم المنتج" required class="w-full bg-obsidian border border-white/10 rounded px-4 py-2.5 text-sm text-white">
                <input type="number" id="prod-price" placeholder="السعر" required class="w-full bg-obsidian border border-white/10 rounded px-4 py-2.5 text-sm text-white">
                <input type="text" id="prod-image" placeholder="صورة المنتج (مثال: t1.jpg)" required class="w-full bg-obsidian border border-white/10 rounded px-4 py-2.5 text-sm text-white">
                <button type="submit" class="w-full bg-gold text-black font-bold py-3 rounded uppercase text-sm">حفظ</button>
            </form>
        </div>
    </div>

    <!-- ID Card Modal -->
    <div id="id-modal" class="fixed inset-0 z-50 bg-black/90 hidden items-center justify-center p-4">
        <div class="relative max-w-2xl w-full">
            <button onclick="closeIdModal()" class="absolute -top-10 left-0 text-white"><i class="fa-solid fa-xmark"></i> إغلاق</button>
            <img id="id-modal-img" class="w-full rounded-xl border border-gold/40">
        </div>
    </div>

    <!-- Firebase Script Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAxdGkvwTeZSxkrgVSACgaoYrzaGLlcI0k",
            authDomain: "test-t-bdfbe.firebaseapp.com",
            databaseURL: "https://test-t-bdfbe-default-rtdb.firebaseio.com",
            projectId: "test-t-bdfbe",
            storageBucket: "test-t-bdfbe.firebasestorage.app",
            messagingSenderId: "211509136380",
            appId: "1:211509136380:web:139a6409a17bfb124bc079"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        let productsList = [];
        let ordersList = [];

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                document.getElementById('admin-user-email').innerText = user.email;
                loadDashboardData();
            } else {
                document.getElementById('login-overlay').classList.remove('hidden');
                document.getElementById('admin-dashboard').classList.add('hidden');
            }
        });

        window.handleLogin = async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('admin-email').value, document.getElementById('admin-password').value);
            } catch (err) { alert('فشل الدخول'); }
        };

        window.handleLogout = () => signOut(auth);

        window.switchTab = (tab) => {
            ['overview', 'products', 'orders'].forEach(t => {
                document.getElementById(`section-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).className = "w-full flex items-center gap-3 px-4 py-3 rounded-lg text-gray-300 hover:bg-white/5 font-semibold text-sm transition";
            });
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = "w-full flex items-center gap-3 px-4 py-3 rounded-lg bg-gold text-black font-semibold text-sm transition";
        };

        async function loadDashboardData() {
            const prodSnap = await get(ref(db, 'products'));
            productsList = prodSnap.exists() ? Object.entries(prodSnap.val()).map(([id, val]) => ({ id, ...val })) : [];
            
            const ordSnap = await get(ref(db, 'orders'));
            ordersList = ordSnap.exists() ? Object.entries(ordSnap.val()).map(([id, val]) => ({ id, ...val })) : [];

            document.getElementById('stat-products').innerText = productsList.length;
            document.getElementById('stat-orders').innerText = ordersList.length;
            
            let rev = 0;
            ordersList.forEach(o => { if (o.status === 'تم التسليم') rev += Number(o.total || 0); });
            document.getElementById('stat-revenue').innerText = rev + ' EGP';

            renderProducts();
            renderOrders();
        }

        function renderProducts() {
            document.getElementById('products-table-body').innerHTML = productsList.map(p => `
                <tr class="hover:bg-white/5">
                    <td class="p-4 flex items-center gap-3">
                        <img src="${p.image}" class="w-12 h-12 object-cover rounded">
                        <div><div class="font-bold text-white">${p.name}</div></div>
                    </td>
                    <td class="p-4 text-gold font-bold">${p.price} EGP</td>
                    <td class="p-4 text-center space-x-2 space-x-reverse">
                        <button onclick="deleteProduct('${p.id}')" class="text-red-400 text-xs">حذف</button>
                    </td>
                </tr>
            `).join('');
        }

        function renderOrders() {
            document.getElementById('orders-table-body').innerHTML = ordersList.map(o => `
                <tr class="hover:bg-white/5">
                    <td class="p-4 font-bold text-white">${o.customerName}</td>
                    <td class="p-4">${o.phone} <span class="text-gold block text-xs">${o.governorate}</span></td>
                    <td class="p-4 font-bold text-gold">${o.total} EGP</td>
                    <td class="p-4">
                        <select onchange="updateStatus('${o.id}', this.value)" class="bg-obsidian border border-white/10 rounded px-2 py-1 text-xs text-white">
                            <option value="جديد" ${o.status === 'جديد' ? 'selected' : ''}>جديد</option>
                            <option value="تم التسليم" ${o.status === 'تم التسليم' ? 'selected' : ''}>تم التسليم</option>
                            <option value="ملغي" ${o.status === 'ملغي' ? 'selected' : ''}>ملغي</option>
                        </select>
                    </td>
                    <td class="p-4">${o.idCardUrl ? `<button onclick="showId('${o.idCardUrl}')" class="text-gold underline text-xs">عرض البطاقة</button>` : 'لا توجد'}</td>
                    <td class="p-4 text-center">
                        <a href="https://wa.me/2${o.phone.replace(/[^0-9]/g, '')}" target="_blank" class="bg-green-600 text-white px-3 py-1 rounded text-xs"><i class="fa-brands fa-whatsapp"></i> واتساب</a>
                    </td>
                </tr>
            `).join('');
        }

        window.openProductModal = () => {
            document.getElementById('product-form').reset();
            document.getElementById('prod-id').value = 't_' + Date.now();
            document.getElementById('product-modal').classList.remove('hidden');
            document.getElementById('product-modal').classList.add('flex');
        };
        window.closeProductModal = () => document.getElementById('product-modal').classList.add('hidden');

        window.saveProduct = async (e) => {
            e.preventDefault();
            const id = document.getElementById('prod-id').value;
            await set(ref(db, 'products/' + id), {
                name: document.getElementById('prod-name').value,
                price: Number(document.getElementById('prod-price').value),
                image: document.getElementById('prod-image').value,
                sizes: ['S', 'M', 'L', 'XL']
            });
            closeProductModal();
            loadDashboardData();
        };

        window.deleteProduct = async (id) => {
            if (confirm('حذف المنتج؟')) { await remove(ref(db, 'products/' + id)); loadDashboardData(); }
        };

        window.updateStatus = async (id, status) => {
            await update(ref(db, `orders/${id}`), { status });
            loadDashboardData();
        };

        window.showId = (url) => {
            document.getElementById('id-modal-img').src = url;
            document.getElementById('id-modal').classList.remove('hidden');
            document.getElementById('id-modal').classList.add('flex');
        };
        window.closeId = () => document.getElementById('id-modal').classList.add('hidden');
    </script>
</body>
</html>
