<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>لوحة الإدارة — LUXE MEN</title>
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/admin.css">
<script type="module" src="/js/admin.js" defer></script>
</head>
<body>
<div id="auth-box">
  <div class="auth-card">
    <h2>تسجيل دخول الأدمن</h2>
    <form id="login-form">
      <label for="a-email">البريد الإلكتروني</label>
      <input id="a-email" name="email" type="email" required autocomplete="username">
      <label for="a-pass">كلمة المرور</label>
      <input id="a-pass" name="password" type="password" required autocomplete="current-password">
      <button class="btn" type="submit">دخول</button>
      <p class="error" id="login-error"></p>
    </form>
  </div>
</div>

<div id="admin-panel" style="display:none">
  <nav class="navbar"><div class="container nav-inner">
    <a class="logo" href="/">LUXE<span>MEN</span> — الإدارة</a>
    <button class="cart-btn" id="logout-btn">تسجيل الخروج</button>
  </div></nav>

  <section class="container">
    <h2 class="section-title">الإحصائيات</h2>
    <div class="stats">
      <div class="stat"><b id="st-total">0</b><span>إجمالي الطلبات</span></div>
      <div class="stat"><b id="st-new">0</b><span>طلبات جديدة</span></div>
      <div class="stat"><b id="st-prep">0</b><span>جاري التجهيز</span></div>
      <div class="stat"><b id="st-shipped">0</b><span>تم الشحن</span></div>
      <div class="stat"><b id="st-delivered">0</b><span>تم التوصيل</span></div>
      <div class="stat"><b id="st-cancelled">0</b><span>ملغاة / متعذرة</span></div>
      <div class="stat gold"><b id="st-sales">0</b><span>مبيعات الطلبات المكتملة</span></div>
    </div>
  </section>

  <section class="container">
    <h2 class="section-title">إدارة الطلبات</h2>
    <div class="filters">
      <input id="search" placeholder="بحث برقم الطلب أو الاسم أو الهاتف">
      <select id="filter-status">
        <option value="">كل الحالات</option>
        <option>جديد</option><option>تم تأكيد الطلب</option><option>جاري التجهيز</option>
        <option>تم التجهيز</option><option>تم الشحن</option><option>خرج للتوصيل</option>
